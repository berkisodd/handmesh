<meta name="theme-color" content="#05080a">
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%;
    font-family: -apple-system, system-ui, sans-serif;
    overscroll-behavior:none; -webkit-text-size-adjust:100%; }
  /* 100vh on iOS Safari includes the address bar, pushing bottom controls
     off-screen. dvh tracks the actually-visible viewport; vh stays as fallback. */
  #stage { position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; }
  video { display:none; }
  canvas {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover;
  }

  /* Single flex row for the top bar so HUD / timer / buttons can never overlap
     on narrow screens — previously all three were absolutely positioned and
     collided on an iPhone. */
  #topBar {
    position:absolute; top:0; left:0; right:0; z-index:6;
    display:flex; align-items:flex-start; gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
            10px calc(10px + env(safe-area-inset-left));
    pointer-events:none;
  }
  #topBar > * { pointer-events:auto; }
  #hud {
    color:#7CFF9E; background:rgba(0,0,0,0.55); border:1px solid rgba(124,255,158,0.4);
    padding:6px 10px; border-radius:8px; font-size:12px; letter-spacing:0.02em;
    pointer-events:none;
    min-width:0; flex:1 1 auto;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #recordIndicator {
    display:none; align-items:center; gap:6px; flex:0 0 auto;
    color:#FF4444; background:rgba(0,0,0,0.55); border:1px solid rgba(255,68,68,0.4);
    padding:6px 10px; border-radius:8px; font-size:12px; font-weight:600;
    white-space:nowrap;
  }
  #recordIndicator.active { display:flex; }
  #recordIndicator.warn { color:#FFD24A; border-color:rgba(255,210,74,0.5); }
  #recordIndicator.warn .record-dot { background:#FFD24A; }
  #micStatus { font-size:12px; opacity:0.85; }
  .record-dot { width:8px; height:8px; background:#FF4444; border-radius:50%; animation: pulse 1s infinite; flex:0 0 auto; }
  @keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:0.4; } }

  #toolbar { display:flex; gap:6px; flex:0 0 auto; }
  #toolbar button {
    background:rgba(0,0,0,0.55); color:#7CFF9E; border:1px solid rgba(124,255,158,0.4);
    border-radius:8px; padding:7px 10px; font-size:12px; font-weight:600;
    white-space:nowrap; -webkit-tap-highlight-color:transparent;
  }
  /* On narrow phones drop the button labels to icons so the row always fits */
  @media (max-width: 430px) {
    #toolbar button .btn-label { display:none; }
    #toolbar button { padding:7px 9px; }
  }

  #recordBtn {
    position:absolute; left:50%; bottom:calc(22px + env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:8;
    width:70px; height:70px; border-radius:50%;
    background:rgba(0,0,0,0.3); border:4px solid rgba(255,255,255,0.9);
    display:flex; align-items:center; justify-content:center; padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  #recordBtn:active { background:rgba(0,0,0,0.5); }
  #recordBtnInner {
    width:54px; height:54px; border-radius:50%; background:#FF3B30;
    transition: width .18s ease, height .18s ease, border-radius .18s ease;
  }
  #recordBtn.recording { border-color:#FF3B30; }
  #recordBtn.recording #recordBtnInner { width:26px; height:26px; border-radius:7px; }
  #recordBtn.unsupported { opacity:0.35; }
  #recordBtn.unsupported #recordBtnInner { background:#888; }

  #viewModeBtn {
    position:absolute; left:50%; bottom:calc(32px + env(safe-area-inset-bottom));
    /* single transform handles both centering and the sideways offset —
       the old calc()+translateX combo double-shifted it */
    transform:translateX(calc(-50% - 66px)); z-index:8;
    width:50px; height:50px; border-radius:50%;
    background:rgba(0,0,0,0.45); border:2px solid rgba(124,255,158,0.5);
    display:flex; align-items:center; justify-content:center; padding:0; color:#7CFF9E;
    -webkit-tap-highlight-color:transparent;
  }
  #viewModeBtn.active { background:rgba(70,255,130,0.28); border-color:#46FF82; color:#EAFFF1; }
  #viewModeBtn:disabled { opacity:0.4; }

  /* Sheets cover the bottom of the screen; fade the shutter row out so it
     isn't stranded behind the panel or tappable through it. */
  body.sheet-open #recordBtn,
  body.sheet-open #viewModeBtn {
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }

  .sheet {
    position:absolute; left:0; right:0; bottom:0;
    max-height:min(56dvh, 420px); overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:rgba(9,13,11,0.92); backdrop-filter: blur(12px);
    border-top:1px solid rgba(124,255,158,0.35); border-radius:18px 18px 0 0;
    padding:10px calc(18px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom))
            calc(18px + env(safe-area-inset-left));
    transform:translateY(105%); transition: transform .25s ease; z-index:10;
    box-sizing:border-box; overscroll-behavior:contain;
  }
  .sheet.open { transform:translateY(0); }
  .sheet-handle { width:36px; height:4px; border-radius:2px; background:rgba(124,255,158,0.4); margin:8px auto 14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; color:#CDEFD9; font-size:14px; transition:opacity .15s; flex-wrap:wrap; }
  .row > label:first-child { flex:0 1 auto; min-width:0; opacity:0.85; }
  .row select { flex:1 1 130px; min-width:0; max-width:180px; }
  .row input[type=range] { flex:1 1 120px; min-width:100px; accent-color:#46FF82; }
  .row.disabled { opacity:0.32; pointer-events:none; }
  select {
    background:rgba(255,255,255,0.08); color:#EAFFF1; border:1px solid rgba(124,255,158,0.3);
    border-radius:6px; padding:7px 8px;
    font-size:16px; /* iOS zooms the page if a focused control is under 16px */
    max-width:100%;
  }
  input[type=color] { width:44px; height:30px; border:none; background:none; padding:0; border-radius:6px; flex:0 0 auto; }
  input[type=checkbox] { accent-color:#46FF82; width:18px; height:18px; flex:0 0 auto; }
  .toggles { flex-direction:column; align-items:flex-start; gap:12px; }
  .toggles label { display:flex; align-items:center; gap:8px; }
  #resetBtn {
    width:100%; background:rgba(255,255,255,0.06); color:#7CFF9E;
    border:1px solid rgba(124,255,158,0.35); border-radius:8px; padding:11px; font-size:14px; margin-top:2px;
  }

  #errorCodesToggle {
    width:100%; background:none; color:#7CFF9E; opacity:0.75;
    border:none; border-top:1px solid rgba(124,255,158,0.15); border-radius:0;
    padding:14px 0 6px; font-size:12.5px; text-align:left; margin-top:14px;
    -webkit-tap-highlight-color:transparent;
  }
  #errorCodesPanel { display:none; }
  #errorCodesPanel.open { display:block; }
  #errorLogSection:empty { display:none; }
  #errorLogSection {
    background:rgba(255,180,60,0.08); border:1px solid rgba(255,180,60,0.3);
    border-radius:8px; padding:10px 12px; margin-bottom:10px; font-size:12px; color:#FFD98A;
  }
  #errorLogSection .log-title { font-weight:700; margin-bottom:4px; }
  #errorLogSection .log-row { opacity:0.85; margin-top:2px; }
  .err-code-row {
    display:flex; flex-direction:column; gap:2px; padding:8px 0;
    border-bottom:1px solid rgba(124,255,158,0.1); font-size:12px;
  }
  .err-code-row:last-child { border-bottom:none; }
  .err-code-id { color:#7CFF9E; font-weight:700; font-family: ui-monospace, monospace; }
  .err-code-title { color:#EAFFF1; font-weight:600; }
  .err-code-meaning { color:#9FB8AA; line-height:1.4; }
  #dataOut {
    color:#7CFF9E; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:10.5px; line-height:1.5; margin:0;
    white-space:pre; overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .recording-info {
    background:rgba(255,68,68,0.1); border:1px solid rgba(255,68,68,0.3); border-radius:8px;
    padding:10px 12px; margin-bottom:12px; color:#FF9999; font-size:13px;
  }
  .recording-info p { margin:0 0 8px 0; }
  .recording-info a { color:#7CFF9E; text-decoration:none; display:inline-block; margin-top:8px; }
  .recording-info a:hover { text-decoration:underline; }

  #recordToast {
    position:absolute; left:50%; bottom:calc(112px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(10px);
    width:min(320px, calc(100% - 32px));
    background:rgba(8,14,11,0.96); border:1px solid rgba(70,255,130,0.55);
    border-radius:14px; padding:14px 16px; z-index:14; box-sizing:border-box;
    box-shadow:0 10px 28px rgba(0,0,0,0.55);
    opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease;
  }
  #recordToast.show { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #recordToast .toast-title { color:#EAFFF1; font-weight:700; font-size:14px; margin:0 0 2px; }
  #recordToast .toast-sub { color:#8FE8AC; font-size:12px; margin:0 0 10px; }
  #recordToast .toast-download {
    display:block; text-align:center; background:#46FF82; color:#06210F;
    font-weight:700; font-size:14px; padding:11px; border-radius:9px; text-decoration:none;
  }
  #toastClose {
    position:absolute; top:6px; right:8px; background:none; border:none; color:#7CFF9E;
    font-size:20px; line-height:1; padding:6px; -webkit-tap-highlight-color:transparent;
  }

  /* ---------------- quality warnings (low light / poor tracking) ---------------- */
  #qualityWarn {
    position:absolute; left:50%; top:calc(100px + env(safe-area-inset-top)); z-index:7;
    transform:translateX(-50%) translateY(-6px);
    display:flex; align-items:center; gap:7px;
    background:rgba(40,24,4,0.88); border:1px solid rgba(255,180,60,0.5);
    border-radius:999px; padding:7px 14px;
    opacity:0; pointer-events:none;
    transition: opacity .3s ease, transform .3s ease;
    white-space:nowrap; max-width:calc(100vw - 32px); overflow:hidden; text-overflow:ellipsis;
  }
  #qualityWarn.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #qualityIcon { font-size:13px; flex:0 0 auto; }

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const video   = document.getElementById('video');
const canvas  = document.getElementById('canvas');
const stageEl = document.getElementById('stage');
const ctx     = canvas.getContext('2d');
const hud     = document.getElementById('hud');
const dataOut = document.getElementById('dataOut');
const recordBtn = document.getElementById('recordBtn');
const recordIndicator = document.getElementById('recordIndicator');
const recordTimer = document.getElementById('recordTimer');
const recordingAlert = document.getElementById('recordingAlert');
const recordMsg = document.getElementById('recordMsg');
const downloadLink = document.getElementById('downloadLink');
const viewModeBtn = document.getElementById('viewModeBtn');
const recordToast = document.getElementById('recordToast');
const toastClose = document.getElementById('toastClose');
const toastDownload = document.getElementById('toastDownload');
const toastSub = document.getElementById('toastSub');
const micStatus = document.getElementById('micStatus');
const qualityWarn = document.getElementById('qualityWarn');
const qualityText = document.getElementById('qualityText');

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];
const TIP_IDX = [4, 8, 12, 16, 20];
const HAND_COLORS = ['#46FF82', '#FFD24A'];
const LANDMARK_NAMES = [
  'wrist','thumb_cmc','thumb_mcp','thumb_ip','thumb_tip',
  'index_mcp','index_pip','index_dip','index_tip',
  'middle_mcp','middle_pip','middle_dip','middle_tip',
  'ring_mcp','ring_pip','ring_dip','ring_tip',
  'pinky_mcp','pinky_pip','pinky_dip','pinky_tip'
];

const DEFAULTS = {
  viewMode: 'camera', // 'camera' | '3d'
  depthMode: 'shade',
  depthAmount: 0.6,
  frameColor: '#46ff82',
  effectStyle: 'invert',
  blendMode: 'multiply',
  blockRes: 64,
  opacity: 0.85,
  smoothing: 0.35,
  frameScale: 1.0,
  twistAmount: 1.0,
  skeletonMode: 'two-tone',
  showSkeleton: true,
  showOutline: true,
  mirror: true
};
const settings = { ...DEFAULTS };

let handLandmarker;
let fxCanvas, fxCtx, maskLow, maskCtx;
let smoothedCorners = null;
let particles = [];
const MAX_PARTICLES = 70;

// --- environment/tracking quality warnings ---
let lumaCanvas = null, lumaCtx = null;
let avgLuma = 128;           // running estimate, 0-255
let lowLightFrames = 0, okLightFrames = 0;
let lowConfFrames = 0, okConfFrames = 0;
const LOW_LIGHT_THRESHOLD = 55;   // below this, average frame brightness reads as "dark"
const LOW_CONF_THRESHOLD = 0.55;  // MediaPipe per-hand detection score
const WARN_STREAK = 20;           // frames needed before flagging, so a blink doesn't trigger it
const CLEAR_STREAK = 30;          // frames needed before clearing, so it doesn't flicker on/off

// --- recording ---
let mediaRecorder = null;
let recordingChunks = [];
let isRecording = false;
let recordingStartTime = 0;
let recordMimeType = null;
let cameraStream = null;
let hasAudio = false;
let stopReason = 'manual';
const MAX_RECORD_MS = 60000;

const MIME_CANDIDATES = [
  'video/mp4;codecs=avc1',
  'video/mp4',
  'video/webm;codecs=vp9',
  'video/webm;codecs=vp8',
  'video/webm'
];

// --- 3D data viewport (lazy-loaded) ---
let THREE = null;
let threeReady = false;
let threeRenderer, threeScene, threeCamera, threeCanvas;
let handGroups3D = [];
let box3D = null; // { group, geom, mat, lineGeom, lineMat }
const SCENE_W = 4, Z_SCALE = 9;
const CAM_FOV_DEG = 45, CONTENT_MARGIN = 1.35;
const TWIST_SEGMENTS = 24;
let twistTurns = 0;      // whole extra rotations accumulated past ±180°
let lastRollAngle = null;
let lastHandKey = null;  // detects hand slots swapping between frames
let smoothedTwist = null;

// Canvas resolution now tracks the actual screen (portrait iPhone, landscape
// desktop, either orientation on iPad) instead of the camera's native buffer.
// videoAspect stays fixed at whatever the camera stream negotiated, and
// coverTransform crops the video source to match the screen without
// distortion — same idea as CSS object-fit:cover, done manually so hand
// landmarks (normalized to the raw video frame) can be mapped through the
// identical crop and stay aligned with what's drawn.
let videoAspect = 16 / 9;
let coverTransform = { offsetX: 0, offsetY: 0, srcW: 0, srcH: 0 };
let resizeTimer = null;

// --- error codes ---
// Central registry so failures show a short stable code (findable in Settings)
// instead of a raw, browser-specific error message that varies by device.
const ERROR_CODES = {
  E01: { title: 'Camera permission denied', meaning: 'You said no to the camera prompt, or your browser is blocking it. Reload and allow camera access.' },
  E02: { title: 'No camera found', meaning: 'This device has no camera, or another app is holding it exclusively.' },
  E03: { title: 'Camera error', meaning: 'The camera stream failed to start for a reason your browser didn\u2019t specify — usually a hardware or driver hiccup. Try reloading.' },
  E04: { title: 'Hand tracking failed to load', meaning: 'The MediaPipe model or WASM runtime couldn\u2019t be fetched — usually a network problem or an ad blocker interfering.' },
  E05: { title: 'Recording not supported', meaning: 'This browser doesn\u2019t support canvas recording (MediaRecorder / captureStream). Safari on older iOS versions is the most common case.' },
  E06: { title: 'No supported recording format', meaning: 'Your browser doesn\u2019t support any of the video formats this app tries. Rare — usually an unusual or very old browser.' },
  E07: { title: 'Recorder failed to initialize', meaning: 'MediaRecorder threw while starting up — can happen if the camera stream dropped right as recording was requested.' },
  E08: { title: 'Recording start failed', meaning: 'Tapping the shutter didn\u2019t actually start capture. Usually transient — try again.' },
  E09: { title: 'Recording stop failed', meaning: 'The recorder didn\u2019t stop cleanly. The clip so far should still save if any data was captured.' },
  E10: { title: '3D view unavailable', meaning: 'Three.js or WebGL failed to initialize — often an old GPU/browser, or WebGL disabled in browser settings.' },
  E11: { title: 'WebGL context lost', meaning: 'The mobile GPU dropped the 3D context, usually from memory pressure. The app tries to recover automatically.' },
  E99: { title: 'Unexpected error', meaning: 'Something failed outside the cases this app specifically checks for. Check the browser console for details.' },
};
const errorLog = []; // codes actually seen this session, shown at the top of the Settings error list

function logError(code, err) {
  const info = ERROR_CODES[code] || { title: 'Unknown error', meaning: 'No description on file for this code.' };
  console.warn(`[${code}] ${info.title}:`, err);
  errorLog.push({ code, time: Date.now(), detail: err?.message || String(err || '') });
  renderErrorLog();
  return code;
}

function renderErrorLog() {
  const logEl = document.getElementById('errorLogSection');
  if (!logEl) return; // markup not built yet — bindControls() renders the initial state instead
  if (!errorLog.length) { logEl.innerHTML = ''; return; }
  const rows = errorLog.slice(-5).map(e => {
    const t = new Date(e.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    return `<div class="log-row">${t} \u2014 <b>${e.code}</b></div>`;
  }).join('');
  logEl.innerHTML = `<div class="log-title">This session</div>${rows}`;
}

function renderErrorCodesList() {
  const listEl = document.getElementById('errorCodesList');
  if (!listEl) return;
  listEl.innerHTML = Object.entries(ERROR_CODES).map(([code, info]) => `
    <div class="err-code-row">
      <div><span class="err-code-id">${code}</span> \u00B7 <span class="err-code-title">${info.title}</span></div>
      <div class="err-code-meaning">${info.meaning}</div>
    </div>
  `).join('');
}

function showFatalError(code, err) {
  logError(code, err);
  const info = ERROR_CODES[code];
  hud.textContent = `${code} \u00B7 ${info.title}`;
}

function hexToRgba(hex, a) {
  const v = hex.replace('#', '');
  return `rgba(${parseInt(v.substring(0,2),16)},${parseInt(v.substring(2,4),16)},${parseInt(v.substring(4,6),16)},${a})`;
}

async function init() {
  let vision;
  try {
    vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
      },
      numHands: 2,
      runningMode: "VIDEO"
    });
  } catch (err) {
    showFatalError('E04', err);
    throw err;
  }

  hud.textContent = "requesting camera…";
  const videoConstraints = { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" };
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: true });
  } catch (err) {
    console.warn('Mic unavailable, falling back to video-only:', err);
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
    } catch (err2) {
      const code = err2.name === 'NotAllowedError' ? 'E01'
        : err2.name === 'NotFoundError' ? 'E02'
        : 'E03';
      showFatalError(code, err2);
      throw err2;
    }
  }
  cameraStream = stream;
  video.srcObject = stream;

  await new Promise(res => { video.onloadedmetadata = res; });
  await video.play();
  videoAspect = video.videoWidth / video.videoHeight || 16 / 9;

  resizeCanvasToDisplay(); // sizes canvas to the actual screen, not the camera's native resolution

  fxCanvas = document.createElement('canvas');
  fxCanvas.width  = canvas.width;
  fxCanvas.height = canvas.height;
  fxCtx = fxCanvas.getContext('2d');

  maskLow = document.createElement('canvas');
  maskCtx = maskLow.getContext('2d');
  resizeMask();

  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvasToDisplay, 150);
  });
  // iOS collapses/expands the address bar without firing a window resize;
  // visualViewport does report it, so the canvas stays correctly sized.
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resizeCanvasToDisplay, 150);
    });
  }
  if (window.screen && screen.orientation) {
    screen.orientation.addEventListener('change', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resizeCanvasToDisplay, 150);
    });
  }

  bindControls();
  setupRecording();
  requestAnimationFrame(loop);
}

// Crops the video source to match the canvas's aspect ratio (whatever shape
// the current screen is), the same behavior CSS object-fit:cover gives —
// done manually here so drawImage and landmark coordinates use the same math.
function updateCoverTransform() {
  const cAspect = canvas.width / canvas.height;
  if (videoAspect > cAspect) {
    coverTransform.srcH = video.videoHeight;
    coverTransform.srcW = coverTransform.srcH * cAspect;
    coverTransform.offsetX = (video.videoWidth - coverTransform.srcW) / 2;
    coverTransform.offsetY = 0;
  } else {
    coverTransform.srcW = video.videoWidth;
    coverTransform.srcH = coverTransform.srcW / cAspect;
    coverTransform.offsetY = (video.videoHeight - coverTransform.srcH) / 2;
    coverTransform.offsetX = 0;
  }
}

// Matches canvas pixel resolution to the actual on-screen size (capped DPR for
// perf), so it's correct whether that's a tall iPhone, an iPad in either
// orientation, or a resizable desktop window — then keeps every dependent
// buffer and the 3D camera in sync.
function resizeCanvasToDisplay() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(stageEl.clientWidth * dpr));
  const h = Math.max(2, Math.round(stageEl.clientHeight * dpr));
  if (canvas.width === w && canvas.height === h) return;

  canvas.width = w;
  canvas.height = h;
  updateCoverTransform();

  if (fxCanvas) {
    fxCanvas.width = w;
    fxCanvas.height = h;
  }
  resizeMask();

  if (threeRenderer) {
    threeRenderer.setSize(w, h, false); // owns threeCanvas.width/height
    updateCameraFraming();
  }
}

function resizeMask() {
  if (!maskLow) return;
  const lowW = settings.blockRes;
  maskLow.width  = lowW;
  maskLow.height = Math.max(1, Math.round(lowW * canvas.height / canvas.width));
}

function setupRecording() {
  if (!canvas.captureStream || !window.MediaRecorder) {
    disableRecording('Recording not supported in this browser');
    logError('E05', new Error('captureStream/MediaRecorder unavailable'));
    return;
  }
  recordMimeType = MIME_CANDIDATES.find(t => MediaRecorder.isTypeSupported(t)) || null;
  if (!recordMimeType) {
    disableRecording('No supported recording format on this device');
    logError('E06', new Error('no supported mime type'));
    return;
  }
  try {
    const canvasStream = canvas.captureStream(30); // same visible canvas in both modes, so recording works regardless of view
    const audioTracks = cameraStream ? cameraStream.getAudioTracks() : [];
    hasAudio = audioTracks.length > 0;
    const recordStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);
    mediaRecorder = new MediaRecorder(recordStream, { mimeType: recordMimeType });
  } catch (err) {
    disableRecording('Recording failed to initialize');
    logError('E07', err);
    return;
  }

  micStatus.textContent = hasAudio ? '🎤' : '🔇';
  micStatus.title = hasAudio ? 'Microphone audio included' : 'No microphone audio (denied or unavailable)';

  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recordingChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const baseType = recordMimeType.split(';')[0];
    const blob = new Blob(recordingChunks, { type: baseType });
    const url = URL.createObjectURL(blob);
    const ext = baseType.includes('mp4') ? 'mp4' : 'webm';
    const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
    const filename = `hand-frame-${timestamp}.${ext}`;
    const sizeMB = (blob.size / 1024 / 1024).toFixed(1);
    const limitNote = stopReason === 'limit' ? ' \u00B7 hit the 60s limit' : '';

    // Panel entry (Style sheet) — kept as a fallback if the toast gets dismissed
    downloadLink.href = url;
    downloadLink.download = filename;
    recordingAlert.style.display = 'block';
    recordMsg.textContent = `Recording saved (${sizeMB} MB)${limitNote}`;

    // Prominent on-screen toast — shown immediately so it's impossible to miss
    toastDownload.href = url;
    toastDownload.download = filename;
    toastSub.textContent = `${sizeMB} MB${limitNote} \u00B7 tap below to save it`;
    recordToast.classList.add('show');
  };
}

function hideToast() { recordToast.classList.remove('show'); }
toastClose.addEventListener('click', hideToast);
toastDownload.addEventListener('click', () => setTimeout(hideToast, 300));

function disableRecording(reason) {
  recordBtn.classList.add('unsupported');
  recordBtn.title = reason;
  recordBtn.disabled = true;
}

function startRecording() {
  if (!mediaRecorder || isRecording) return;
  try {
    recordingChunks = [];
    recordingAlert.style.display = 'none';
    hideToast();
    stopReason = 'manual';
    recordingStartTime = performance.now();
    mediaRecorder.start();
    isRecording = true;
    recordBtn.classList.add('recording');
    recordIndicator.classList.add('active');
    recordIndicator.classList.remove('warn');
  } catch (err) {
    logError('E08', err);
  }
}

function stopRecording(reason) {
  if (!mediaRecorder || !isRecording) return;
  try {
    stopReason = reason || 'manual';
    mediaRecorder.stop();
    isRecording = false;
    recordBtn.classList.remove('recording');
    recordIndicator.classList.remove('active', 'warn');
  } catch (err) {
    logError('E09', err);
  }
}

recordBtn.addEventListener('click', () => {
  if (isRecording) stopRecording('manual');
  else startRecording();
});

document.getElementById('includeAudio').addEventListener('change', e => {
  if (!cameraStream) return;
  cameraStream.getAudioTracks().forEach(t => { t.enabled = e.target.checked; });
  const on = e.target.checked && cameraStream.getAudioTracks().length > 0;
  micStatus.textContent = on ? '🎤' : '🔇';
});

/* ---------------- 3D data viewport ---------------- */

async function ensureThree() {
  if (THREE) return;
  const mod = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  THREE = mod;
  initThreeScene();
}

function makeHandGroup3D() {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0x46ff82 });
  const jointGeom = new THREE.SphereGeometry(1, 8, 6);
  const joints = [];
  for (let i = 0; i < 21; i++) {
    const mesh = new THREE.Mesh(jointGeom, mat);
    mesh.scale.setScalar(TIP_IDX.includes(i) ? 0.05 : 0.028);
    group.add(mesh);
    joints.push(mesh);
  }
  const lineGeom = new THREE.BufferGeometry();
  lineGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(HAND_CONNECTIONS.length * 2 * 3), 3));
  const lineMat = new THREE.LineBasicMaterial({ color: 0x46ff82 });
  const lines = new THREE.LineSegments(lineGeom, lineMat);
  group.add(lines);
  threeScene.add(group);
  return { group, joints, mat, lineGeom, lineMat };
}

function initThreeScene() {
  threeCanvas = document.createElement('canvas');
  threeCanvas.width = canvas.width;
  threeCanvas.height = canvas.height;
  threeRenderer = new THREE.WebGLRenderer({
    canvas: threeCanvas,
    antialias: true,
    alpha: false,
    // iOS Safari discards the WebGL drawing buffer immediately after a render,
    // so copying it into the visible 2D canvas with drawImage yields black.
    // Chrome tolerates this; Safari does not.
    preserveDrawingBuffer: true,
    powerPreference: 'default',
    failIfMajorPerformanceCaveat: false
  });
  threeRenderer.setPixelRatio(1);
  threeRenderer.setSize(canvas.width, canvas.height, false);
  threeRenderer.setClearColor(0x0a0f0c, 1);

  // Mobile GPUs can silently drop the context; recover instead of staying black.
  threeCanvas.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    logError('E11', new Error('WebGL context lost'));
  });
  threeCanvas.addEventListener('webglcontextrestored', () => {
    console.warn('WebGL context restored');
    threeRenderer.setSize(canvas.width, canvas.height, false);
    updateCameraFraming();
  });

  threeScene = new THREE.Scene();
  threeScene.background = new THREE.Color(0x0a0f0c);
  threeScene.fog = new THREE.Fog(0x0a0f0c, 3, 9);

  threeCamera = new THREE.PerspectiveCamera(CAM_FOV_DEG, canvas.width / canvas.height, 0.05, 50);
  updateCameraFraming(); // sets a static but aspect-correct position — still doesn't move on its own

  const grid = new THREE.GridHelper(8, 20, 0x2a4a35, 0x162019);
  grid.position.y = -1.4;
  threeScene.add(grid);
  threeScene.add(new THREE.AxesHelper(0.6));

  handGroups3D = [makeHandGroup3D(), makeHandGroup3D()];

  const geom = new THREE.BufferGeometry();
  // Subdivided grid rather than a single quad — a flat 4-vertex plane can only
  // spin, it can't twist. Extra spans let the surface rotate progressively
  // along its length so it visibly tangles.
  const segs = TWIST_SEGMENTS;
  const vertCount = (segs + 1) * 2;
  geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertCount * 3), 3));
  const idx = [];
  for (let i = 0; i < segs; i++) {
    const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
    idx.push(a, b, d, a, d, c);
  }
  geom.setIndex(idx);
  const mat = new THREE.MeshBasicMaterial({ color: 0x46ff82, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geom, mat);

  const lineGeom = new THREE.BufferGeometry();
  lineGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertCount * 3), 3));
  const lineIdx = [];
  for (let i = 0; i < segs; i++) {
    const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
    lineIdx.push(a, c, b, d); // rails
    lineIdx.push(a, b);       // rungs
  }
  lineIdx.push(segs * 2, segs * 2 + 1);
  lineGeom.setIndex(lineIdx);
  const lineMat = new THREE.LineBasicMaterial({ color: 0x46ff82 });
  const line = new THREE.LineSegments(lineGeom, lineMat);

  const group = new THREE.Group();
  group.add(mesh, line);
  threeScene.add(group);
  box3D = { group, geom, mat, lineGeom, lineMat };
}

function pxToScene(p) {
  const sceneH = SCENE_W / videoAspect; // stable, camera-stream aspect — not the screen's
  const mirrorSign = settings.mirror ? -1 : 1;
  const nx = (p.x / canvas.width - 0.5) * mirrorSign;
  const ny = (p.y / canvas.height - 0.5);
  return new THREE.Vector3(nx * SCENE_W, -ny * sceneH, -(p.z || 0) * Z_SCALE);
}

// Content (hands + box) is a fixed-size world-space region; this picks the
// camera distance so that fixed region always fits the visible frustum,
// whatever the screen's aspect is — this is what actually fixes the iPhone
// "shrunk" bug, rather than pre-scaling content by the screen's aspect.
function updateCameraFraming() {
  if (!threeCamera) return;
  const aspect = canvas.width / canvas.height;
  threeCamera.aspect = aspect;

  const halfW = (SCENE_W / 2) * CONTENT_MARGIN;
  const halfH = (SCENE_W / videoAspect / 2) * CONTENT_MARGIN;
  const fovRad = CAM_FOV_DEG * Math.PI / 180;
  const dist = Math.max(halfH, halfW / aspect) / Math.tan(fovRad / 2);

  threeCamera.position.set(0, dist * 0.21, dist);
  threeCamera.lookAt(0, -0.05, 0);
  threeCamera.far = dist * 4;
  threeCamera.updateProjectionMatrix();

  // Fog must track camera distance. Portrait phones need a much larger dist to
  // fit the same content, and a fixed near/far fog range swallowed the whole
  // scene in fog colour — which read as a black screen on iPhone.
  if (threeScene && threeScene.fog) {
    threeScene.fog.near = dist * 0.55;
    threeScene.fog.far = dist * 2.4;
  }
}

function updateHandGroup3D(idx, landmarksPx, color) {
  const g = handGroups3D[idx];
  g.group.visible = true;
  g.mat.color.setStyle(color);
  g.lineMat.color.setStyle(color);

  landmarksPx.forEach((p, i) => {
    const v = pxToScene(p);
    g.joints[i].position.copy(v);
  });

  const positions = g.lineGeom.attributes.position.array;
  HAND_CONNECTIONS.forEach(([a, b], i) => {
    const va = g.joints[a].position, vb = g.joints[b].position;
    positions[i*6]=va.x; positions[i*6+1]=va.y; positions[i*6+2]=va.z;
    positions[i*6+3]=vb.x; positions[i*6+4]=vb.y; positions[i*6+5]=vb.z;
  });
  g.lineGeom.attributes.position.needsUpdate = true;
}

function updateBox3D(poly) {
  box3D.group.visible = true;
  const v = poly.map(pxToScene);

  // poly corners are angle-sorted; pair them into the two ends of a ribbon.
  const endA0 = v[0], endA1 = v[1], endB0 = v[3], endB1 = v[2];
  const startMid = endA0.clone().add(endA1).multiplyScalar(0.5);
  const endMid   = endB0.clone().add(endB1).multiplyScalar(0.5);
  const axis = endMid.clone().sub(startMid);
  const axisLen = axis.length() || 1e-4;
  axis.divideScalar(axisLen);

  const startArm = endA1.clone().sub(endA0).multiplyScalar(0.5);
  const endArm   = endB1.clone().sub(endB0).multiplyScalar(0.5);

  // Single twist source: the smoothed accumulated hand roll. Previously this
  // ALSO measured the angle between the two end cross-sections and added the
  // two together — but that geometric term is itself derived from the same
  // moving corners, so the two fought each other and amplified any jitter.
  const twist = Math.PI * 2 * (smoothedTwist || 0);

  const segs = TWIST_SEGMENTS;
  const pos = box3D.geom.attributes.position;
  const linePos = box3D.lineGeom.attributes.position;
  const tmp = new THREE.Vector3();
  const q = new THREE.Quaternion();

  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const center = startMid.clone().lerp(endMid, t);
    // Interpolate half-width, then rotate that arm about the axis by the
    // running twist — each span is rotated a little more than the last.
    const arm = startArm.clone().lerp(endArm, t);
    q.setFromAxisAngle(axis, twist * t);
    arm.applyQuaternion(q);

    tmp.copy(center).sub(arm);
    pos.setXYZ(i * 2, tmp.x, tmp.y, tmp.z);
    linePos.setXYZ(i * 2, tmp.x, tmp.y, tmp.z);

    tmp.copy(center).add(arm);
    pos.setXYZ(i * 2 + 1, tmp.x, tmp.y, tmp.z);
    linePos.setXYZ(i * 2 + 1, tmp.x, tmp.y, tmp.z);
  }

  pos.needsUpdate = true;
  linePos.needsUpdate = true;
  box3D.geom.computeVertexNormals();
  box3D.geom.computeBoundingSphere();
  box3D.mat.color.setStyle(settings.frameColor);
  box3D.mat.opacity = settings.opacity * 0.55;
  box3D.lineMat.color.setStyle(settings.frameColor);
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Burned into the canvas itself so it's part of the recorded video, not just an
// on-screen overlay. Only appears while actively recording. Drawn in a reset
// transform so it stays upright and un-mirrored regardless of view mode.
// Position cycles through the four corners on a timer, sliding between them
// with easing (plus a small landing pop) — same idea as a downloaded TikTok watermark.
const WM_CORNERS = [
  (bw, bh, inset) => ({ x: canvas.width - bw - inset, y: canvas.height - bh - inset }), // bottom-right
  (bw, bh, inset) => ({ x: inset, y: inset }),                                          // top-left
  (bw, bh, inset) => ({ x: canvas.width - bw - inset, y: inset }),                       // top-right
  (bw, bh, inset) => ({ x: inset, y: canvas.height - bh - inset }),                      // bottom-left
];
const WM_SLOT_MS = 3400;
const WM_TRANS_MS = 650;

function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

function drawWatermark() {
  if (!isRecording) return;
  const line1 = 'berkisodd.github.io/handmesh';
  const line2 = 'Created by Berk :)';

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.textBaseline = 'top';

  ctx.font = '600 12px -apple-system, system-ui, sans-serif';
  const w1 = ctx.measureText(line1).width;
  ctx.font = '400 12px -apple-system, system-ui, sans-serif';
  const w2 = ctx.measureText(line2).width;

  const pad = 10;
  const boxW = Math.max(w1, w2) + pad * 2;
  const boxH = 40;
  const inset = 14;

  const elapsed = performance.now() - recordingStartTime;
  const slot = Math.floor(elapsed / WM_SLOT_MS);
  const into = elapsed % WM_SLOT_MS;
  const posA = WM_CORNERS[slot % WM_CORNERS.length](boxW, boxH, inset);
  const posB = WM_CORNERS[(slot + 1) % WM_CORNERS.length](boxW, boxH, inset);

  let t = 0;
  if (into > WM_SLOT_MS - WM_TRANS_MS) {
    t = easeInOutCubic((into - (WM_SLOT_MS - WM_TRANS_MS)) / WM_TRANS_MS);
  }
  const x = posA.x + (posB.x - posA.x) * t;
  const y = posA.y + (posB.y - posA.y) * t + Math.sin(elapsed / 450) * 2; // subtle idle bob

  // brief landing pop right after arriving at a new corner
  let scale = 1;
  if (into < 250) {
    const p = 1 - into / 250;
    scale = 1 + 0.12 * p * Math.sin(p * Math.PI);
  }
  const cx = x + boxW / 2, cy = y + boxH / 2;
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRectPath(ctx, x, y, boxW, boxH, 8);
  ctx.fill();

  ctx.fillStyle = '#7CFF9E';
  ctx.font = '600 12px -apple-system, system-ui, sans-serif';
  ctx.fillText(line1, x + pad, y + 7);

  ctx.fillStyle = 'rgba(234,255,241,0.85)';
  ctx.font = '400 12px -apple-system, system-ui, sans-serif';
  ctx.fillText(line2, x + pad, y + 22);

  ctx.restore();
}

function render3D(handRes) {
  const raw = handRes.landmarks || [];
  const handedRaw = handRes.handednesses || handRes.handedness || [];
  const order = raw.map((h, i) => i).sort((a, b) => raw[a][0].x - raw[b][0].x);
  const hands = order.map(i => raw[i]);
  const handedness = order.map(i => handedRaw[i]);
  updateQualityWarning(handedness);

  handGroups3D.forEach((g, i) => {
    if (i < hands.length) updateHandGroup3D(i, hands[i].map(toPx), skeletonColorFor(i));
    else g.group.visible = false;
  });

  const twoHands = hands.length >= 2;
  let poly = null;
  if (twoHands && settings.showOutline) {
    const tips = [];
    for (const h of hands.slice(0, 2)) tips.push(toPx(h[4]), toPx(h[8]));

    // Roll from wrist(0) -> middle knuckle(9): the hand's spine. The old
    // thumb-tip -> index-tip vector is nearly zero-length while you're making a
    // frame, so a few pixels of tracking noise swung its angle wildly.
    const rollOf = h => Math.atan2(h[9].y - h[0].y, h[9].x - h[0].x);

    // Hands are sorted by wrist x, so when they cross, the two slots swap and
    // the relative angle flips ~180 degrees in one frame. Unwrapping read that
    // as a real half-turn and injected a whole rotation — the main jerk source.
    const idKey = handedness.map(hd => hd?.[0]?.categoryName || '?').join('');
    const orderChanged = idKey !== lastHandKey;
    lastHandKey = idKey;

    const rel = rollOf(hands[1]) - rollOf(hands[0]);
    if (lastRollAngle !== null && !orderChanged) {
      let d = rel - lastRollAngle;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      // A hand can't really rotate ~35 deg between frames at 30fps, so treat
      // anything larger as a glitch and drop it instead of winding the ribbon.
      if (Math.abs(d) < 0.6) {
        twistTurns += d / (Math.PI * 2);
        twistTurns = Math.max(-3, Math.min(3, twistTurns));
      }
    }
    lastRollAngle = rel;

    // Smooth the value the ribbon actually uses so residual jitter doesn't
    // show up as shaking even when the raw reading wobbles a little.
    const targetTwist = twistTurns * settings.twistAmount;
    smoothedTwist = smoothedTwist === null
      ? targetTwist
      : smoothedTwist + (targetTwist - smoothedTwist) * 0.15;

    const quad = buildQuad(tips);
    poly = smoothCorners(scalePolygon(quad, settings.frameScale));
    updateBox3D(poly);
  } else {
    box3D.group.visible = false;
    if (!twoHands) {
      smoothedCorners = null;
      lastRollAngle = null;
      lastHandKey = null;
      twistTurns = 0;
      smoothedTwist = null;
    }
  }

  threeRenderer.render(threeScene, threeCamera);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(threeCanvas, 0, 0, canvas.width, canvas.height);
  drawWatermark();

  const narrow3d = window.innerWidth < 430;
  hud.textContent = hands.length === 0
    ? (narrow3d ? "3D \u00B7 show hands" : "3D data view \u00B7 show your hands")
    : `${narrow3d ? '3D' : '3D data view'} \u00B7 ${hands.length} hand${hands.length > 1 ? 's' : ''}`;

  updateDataPanel(hands, handedness, poly, 0);
}

/* ---------------- shared tracking + camera-mode render ---------------- */

let lastVideoTime = -1;
let lastRafTs = performance.now();
let fps = 0, detectMs = 0;

function loop(ts) {
  const dt = ts - lastRafTs;
  lastRafTs = ts;
  if (dt > 0) fps = fps ? fps * 0.9 + (1000 / dt) * 0.1 : 1000 / dt;

  if (isRecording) {
    const elapsedMs = performance.now() - recordingStartTime;
    const elapsed = Math.floor(elapsedMs / 1000);
    recordTimer.textContent = `${Math.floor(elapsed / 60)}:${(elapsed % 60).toString().padStart(2, '0')}`;
    if (elapsedMs >= MAX_RECORD_MS - 5000 && elapsedMs < MAX_RECORD_MS) {
      recordIndicator.classList.add('warn');
    }
    if (elapsedMs >= MAX_RECORD_MS) {
      stopRecording('limit');
    }
  }

  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const t0 = performance.now();
    const handRes = handLandmarker.detectForVideo(video, ts);
    detectMs = detectMs * 0.9 + (performance.now() - t0) * 0.1;
    if (settings.viewMode === '3d' && threeReady) render3D(handRes);
    else renderCamera(handRes);
  }
  requestAnimationFrame(loop);
}

// Landmarks are normalized 0..1 against the full video frame — route them
// through the same crop used to draw the video so dots land exactly on the
// visible (cropped) image instead of drifting on non-16:9 screens.
const toPx = lm => {
  const vx = lm.x * video.videoWidth;
  const vy = lm.y * video.videoHeight;
  return {
    x: (vx - coverTransform.offsetX) / coverTransform.srcW * canvas.width,
    y: (vy - coverTransform.offsetY) / coverTransform.srcH * canvas.height,
    z: lm.z
  };
};

function buildQuad(tipPoints) {
  const cx = tipPoints.reduce((s, p) => s + p.x, 0) / tipPoints.length;
  const cy = tipPoints.reduce((s, p) => s + p.y, 0) / tipPoints.length;

  const ordered = tipPoints
    .map(p => ({ ...p, ang: Math.atan2(p.y - cy, p.x - cx) }))
    .sort((a, b) => a.ang - b.ang);

  const zs = ordered.map(p => p.z);
  const zMin = Math.min(...zs), zMax = Math.max(...zs);
  const zRange = Math.max(1e-4, zMax - zMin);

  return ordered.map(p => {
    const depth = (p.z - zMin) / zRange;
    if (settings.depthMode !== 'warp') return { x: p.x, y: p.y, z: p.z, depth };
    const push = 1 + (0.5 - depth) * 0.18 * settings.depthAmount;
    return { x: cx + (p.x - cx) * push, y: cy + (p.y - cy) * push, z: p.z, depth };
  });
}

function centroid(pts) {
  let cx = 0, cy = 0;
  for (const p of pts) { cx += p.x; cy += p.y; }
  return { x: cx / pts.length, y: cy / pts.length };
}

function scalePolygon(pts, f) {
  if (f === 1) return pts;
  const c = centroid(pts);
  return pts.map(p => ({ ...p, x: c.x + (p.x - c.x) * f, y: c.y + (p.y - c.y) * f }));
}

function smoothCorners(corners) {
  const a = settings.smoothing;
  if (a <= 0 || !smoothedCorners || smoothedCorners.length !== corners.length) {
    smoothedCorners = corners.map(p => ({ ...p }));
    return smoothedCorners;
  }
  smoothedCorners = smoothedCorners.map((prev, i) => ({
    x: prev.x * a + corners[i].x * (1 - a),
    y: prev.y * a + corners[i].y * (1 - a),
    z: corners[i].z,
    depth: prev.depth * a + corners[i].depth * (1 - a)
  }));
  return smoothedCorners;
}

function polygonArea(pts) {
  let area = 0;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    area += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
  }
  return Math.abs(area / 2);
}

function skeletonColorFor(i) {
  if (settings.skeletonMode === 'match') return settings.frameColor;
  if (settings.skeletonMode === 'rainbow') return `hsl(${(i * 137 + performance.now() / 20) % 360}, 90%, 60%)`;
  return HAND_COLORS[i % HAND_COLORS.length];
}

function drawHand(pts, color, highlightFrame) {
  ctx.lineWidth = 3;
  ctx.strokeStyle = color;
  ctx.beginPath();
  for (const [a, b] of HAND_CONNECTIONS) {
    ctx.moveTo(pts[a].x, pts[a].y);
    ctx.lineTo(pts[b].x, pts[b].y);
  }
  ctx.stroke();

  for (let i = 0; i < pts.length; i++) {
    const isTip = TIP_IDX.includes(i);
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, isTip ? 6 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = isTip ? '#ffffff' : color;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  if (highlightFrame) {
    for (const i of [4, 8]) {
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, 10, 0, Math.PI * 2);
      ctx.strokeStyle = '#FFEE55';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function tracePath(c, poly, sx = 1, sy = 1) {
  c.beginPath();
  c.moveTo(poly[0].x * sx, poly[0].y * sy);
  for (let i = 1; i < poly.length; i++) c.lineTo(poly[i].x * sx, poly[i].y * sy);
  c.closePath();
}

function buildLowResMask(poly) {
  const { width: lw, height: lh } = maskLow;
  maskCtx.clearRect(0, 0, lw, lh);
  maskCtx.fillStyle = '#fff';
  tracePath(maskCtx, poly, lw / canvas.width, lh / canvas.height);
  maskCtx.fill();
}

function drawDepthEdges(poly) {
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const near = 1 - (a.depth + b.depth) / 2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = hexToRgba(settings.frameColor, 0.3 + near * 0.7);
    ctx.lineWidth = 1.5 + near * 3.5;
    ctx.stroke();
  }
}

// Samples the video at low resolution to estimate average brightness — cheap
// (16x9 px) so it's fine to run every frame, no need to touch the full canvas.
function sampleBrightness() {
  if (!lumaCanvas) {
    lumaCanvas = document.createElement('canvas');
    lumaCanvas.width = 16; lumaCanvas.height = 9;
    lumaCtx = lumaCanvas.getContext('2d', { willReadFrequently: true });
  }
  try {
    lumaCtx.drawImage(video, 0, 0, 16, 9);
    const data = lumaCtx.getImageData(0, 0, 16, 9).data;
    let sum = 0;
    for (let i = 0; i < data.length; i += 4) {
      sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    }
    const luma = sum / (data.length / 4);
    avgLuma = avgLuma * 0.85 + luma * 0.15; // smoothed, ignores single dark frames
  } catch (e) { /* canvas read can fail on some browsers mid-permission-change — skip that frame */ }
}

// Debounced with a frame streak in both directions: needs several bad frames
// in a row to warn (a blink or a hand pausing shouldn't trigger it), and
// several good frames in a row to clear (so it doesn't flicker on/off at the
// threshold boundary).
function updateQualityWarning(handedness) {
  sampleBrightness();

  if (avgLuma < LOW_LIGHT_THRESHOLD) { lowLightFrames++; okLightFrames = 0; }
  else { okLightFrames++; lowLightFrames = 0; }

  const scores = handedness.filter(Boolean).map(hd => hd[0]?.score ?? 1);
  const hasHands = scores.length > 0;
  const worstConf = hasHands ? Math.min(...scores) : 1;
  if (hasHands && worstConf < LOW_CONF_THRESHOLD) { lowConfFrames++; okConfFrames = 0; }
  else { okConfFrames++; lowConfFrames = 0; }

  const isDark = lowLightFrames >= WARN_STREAK;
  const isShaky = hasHands && lowConfFrames >= WARN_STREAK;
  const clearDark = okLightFrames >= CLEAR_STREAK;
  const clearShaky = okConfFrames >= CLEAR_STREAK;

  let msg = null;
  if (isDark && isShaky) msg = 'Low light \u00B7 tracking may be unreliable — try brighter lighting';
  else if (isDark) msg = 'Low light detected — tracking works best with more light';
  else if (isShaky) msg = "Tracking is unsteady — hold hands clearly in frame";

  if (msg) {
    qualityText.textContent = msg;
    qualityWarn.classList.add('show');
  } else if (clearDark && clearShaky) {
    qualityWarn.classList.remove('show');
  }
}

function drawFlatOutline(poly) {
  const isOutlineMode = settings.effectStyle === 'outline';
  tracePath(ctx, poly);
  ctx.strokeStyle = hexToRgba(settings.frameColor, isOutlineMode ? Math.max(settings.opacity, 0.6) : 0.4);
  ctx.lineWidth = isOutlineMode ? 4 : 2;
  ctx.stroke();
}

function fillDimInterior(poly, alpha) {
  buildLowResMask(poly);
  fxCtx.save();
  fxCtx.setTransform(1, 0, 0, 1, 0, 0);
  fxCtx.globalCompositeOperation = 'source-over';
  fxCtx.filter = 'none';
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  fxCtx.fillStyle = hexToRgba(settings.frameColor, alpha);
  fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
  fxCtx.globalCompositeOperation = 'destination-in';
  fxCtx.imageSmoothingEnabled = false;
  fxCtx.drawImage(maskLow, 0, 0, fxCanvas.width, fxCanvas.height);
  fxCtx.restore();
  ctx.drawImage(fxCanvas, 0, 0);
}

// Pulsing dim fill + a glowing outline that bleeds outside the box via shadowBlur
// (deliberately not clipped/pixelated — glow needs to extend past the edge).
function drawGlowEffect(poly) {
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 700);
  fillDimInterior(poly, settings.opacity * 0.28 * (0.6 + 0.4 * pulse));

  ctx.save();
  ctx.shadowColor = settings.frameColor;
  ctx.shadowBlur = 14 + 16 * pulse;
  ctx.strokeStyle = hexToRgba(settings.frameColor, 0.9);
  ctx.lineWidth = 2.5 + 1.5 * pulse;
  tracePath(ctx, poly);
  ctx.stroke();
  ctx.restore();
}

function spawnParticle(poly) {
  const i = Math.floor(Math.random() * poly.length);
  const a = poly[i], b = poly[(i + 1) % poly.length];
  const u = Math.random();
  const x = a.x + (b.x - a.x) * u;
  const y = a.y + (b.y - a.y) * u;

  const ex = b.x - a.x, ey = b.y - a.y;
  const len = Math.hypot(ex, ey) || 1;
  let nx = -ey / len, ny = ex / len;
  const c = centroid(poly);
  if ((x - c.x) * nx + (y - c.y) * ny < 0) { nx = -nx; ny = -ny; } // push outward, away from center

  const speed = (18 + Math.random() * 26) / 60;
  const jitter = (Math.random() - 0.5) * 0.6;
  particles.push({
    x, y,
    vx: (nx + jitter) * speed,
    vy: (ny + jitter) * speed,
    life: 1,
    decay: 0.012 + Math.random() * 0.012,
    r: 1.5 + Math.random() * 2.2
  });
}

// Thin base outline (so the shape always reads) plus sparks drifting outward
// from the edges and fading — no pixelated fill, this one's meant to feel light.
function drawParticleEffect(poly) {
  tracePath(ctx, poly);
  ctx.strokeStyle = hexToRgba(settings.frameColor, 0.35);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  for (let i = 0; i < 2 && particles.length < MAX_PARTICLES; i++) spawnParticle(poly);

  ctx.save();
  ctx.shadowColor = settings.frameColor;
  ctx.shadowBlur = 8;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = hexToRgba(settings.frameColor, settings.opacity * p.life);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Dim fill + a glowing horizontal line sweeping the box on a loop, clipped to
// the actual quad shape so it doesn't spill past the corners.
function drawScanEffect(poly) {
  fillDimInterior(poly, settings.opacity * 0.18);

  const ys = poly.map(p => p.y), xs = poly.map(p => p.x);
  const top = Math.min(...ys), bottom = Math.max(...ys);
  const left = Math.min(...xs), right = Math.max(...xs);
  const lineY = top + (bottom - top) * ((performance.now() % 1600) / 1600);

  ctx.save();
  tracePath(ctx, poly);
  ctx.clip();

  const grad = ctx.createLinearGradient(0, lineY - 40, 0, lineY);
  grad.addColorStop(0, hexToRgba(settings.frameColor, 0));
  grad.addColorStop(1, hexToRgba(settings.frameColor, 0.5));
  ctx.fillStyle = grad;
  ctx.fillRect(left, lineY - 40, right - left, 40);

  ctx.strokeStyle = hexToRgba(settings.frameColor, 0.95);
  ctx.lineWidth = 2;
  ctx.shadowColor = settings.frameColor;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(left, lineY);
  ctx.lineTo(right, lineY);
  ctx.stroke();
  ctx.restore();

  tracePath(ctx, poly);
  ctx.strokeStyle = hexToRgba(settings.frameColor, 0.4);
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawFrameEffect(poly) {
  if (settings.effectStyle === 'glow') { drawGlowEffect(poly); return; }
  if (settings.effectStyle === 'particles') { drawParticleEffect(poly); return; }
  if (settings.effectStyle === 'scan') { drawScanEffect(poly); return; }

  const tint = hexToRgba(settings.frameColor, settings.opacity);

  if (settings.effectStyle !== 'outline') {
    buildLowResMask(poly);
    fxCtx.save();
    fxCtx.setTransform(1, 0, 0, 1, 0, 0);
    fxCtx.globalCompositeOperation = 'source-over';
    fxCtx.filter = 'none';
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

    if (settings.effectStyle === 'invert') {
      fxCtx.filter = 'invert(1) saturate(1.4)';
      fxCtx.drawImage(
        video,
        coverTransform.offsetX, coverTransform.offsetY, coverTransform.srcW, coverTransform.srcH,
        0, 0, fxCanvas.width, fxCanvas.height
      );
      fxCtx.filter = 'none';
      fxCtx.globalCompositeOperation = settings.blendMode;
      fxCtx.fillStyle = tint;
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
    } else if (settings.effectStyle === 'solid') {
      fxCtx.fillStyle = tint;
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
    } else if (settings.effectStyle === 'cycle') {
      fxCtx.filter = `invert(1) hue-rotate(${(performance.now() / 15) % 360}deg) saturate(2)`;
      fxCtx.drawImage(
        video,
        coverTransform.offsetX, coverTransform.offsetY, coverTransform.srcW, coverTransform.srcH,
        0, 0, fxCanvas.width, fxCanvas.height
      );
      fxCtx.filter = 'none';
      fxCtx.globalCompositeOperation = settings.blendMode;
      fxCtx.fillStyle = hexToRgba(settings.frameColor, settings.opacity * 0.6);
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
    }

    fxCtx.globalCompositeOperation = 'destination-in';
    fxCtx.imageSmoothingEnabled = false;
    fxCtx.drawImage(maskLow, 0, 0, fxCanvas.width, fxCanvas.height);
    fxCtx.restore();

    ctx.drawImage(fxCanvas, 0, 0);
  }

  if (settings.depthMode === 'flat') {
    if (settings.showOutline || settings.effectStyle === 'outline') drawFlatOutline(poly);
  } else {
    if (settings.showOutline || settings.effectStyle === 'outline') drawDepthEdges(poly);
  }
}

let dataFrameCounter = 0;
function updateDataPanel(hands, handedness, poly, tilt) {
  if (!document.getElementById('dataPanel').classList.contains('open')) return;
  if (++dataFrameCounter % 5 !== 0) return;

  let out = `render fps  ${fps.toFixed(1)}\ndetect ms   ${detectMs.toFixed(1)}\nhands       ${hands.length}\nview mode   ${settings.viewMode}\nrec codec   ${recordMimeType || 'n/a'}\n`;
  if (poly) {
    out += `frame area  ${polygonArea(poly).toFixed(0)} px\u00B2\n`;
    out += `corner z    ${poly.map(p => p.z.toFixed(3)).join('  ')}\n`;
  }
  out += `\n`;

  hands.forEach((h, i) => {
    const hd = handedness?.[i]?.[0];
    const shown = hd ? (settings.mirror
      ? (hd.categoryName === 'Left' ? 'Right' : 'Left')
      : hd.categoryName) : null;
    out += `-- hand ${i}${shown ? `  ${shown} ${(hd.score * 100).toFixed(0)}%` : ''} --\n`;
    h.forEach((lm, j) => {
      out += `${LANDMARK_NAMES[j].padEnd(11)} x:${lm.x.toFixed(3)} y:${lm.y.toFixed(3)} z:${lm.z.toFixed(3)}\n`;
    });
    out += `\n`;
  });

  dataOut.textContent = out.trimEnd();
}

function renderCamera(handRes) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (settings.mirror) {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(
    video,
    coverTransform.offsetX, coverTransform.offsetY, coverTransform.srcW, coverTransform.srcH,
    0, 0, canvas.width, canvas.height
  );

  const raw = handRes.landmarks || [];
  const handedRaw = handRes.handednesses || handRes.handedness || [];
  const order = raw.map((h, i) => i).sort((a, b) => raw[a][0].x - raw[b][0].x);
  const hands = order.map(i => raw[i]);
  const handedness = order.map(i => handedRaw[i]);
  updateQualityWarning(handedness);

  const twoHands = hands.length >= 2;
  let poly = null, tilt = 0;

  if (twoHands) {
    const tips = [];
    for (const h of hands.slice(0, 2)) tips.push(toPx(h[4]), toPx(h[8]));
    const quad = buildQuad(tips);
    poly = smoothCorners(scalePolygon(quad, settings.frameScale));
    const zs = poly.map(p => p.z);
    tilt = Math.max(...zs) - Math.min(...zs);
    drawFrameEffect(poly);
  } else {
    smoothedCorners = null;
    if (particles.length) particles = [];
  }

  if (settings.showSkeleton) {
    hands.forEach((h, i) => drawHand(h.map(toPx), skeletonColorFor(i), twoHands));
  }

  drawWatermark();

  const narrow = window.innerWidth < 430;
  hud.textContent = hands.length === 0
    ? (narrow ? "show your hands" : "show your hands to the camera")
    : `${hands.length} hand${hands.length > 1 ? 's' : ''}`
      + (twoHands ? ` \u00B7 tilt ${tilt.toFixed(2)}` : (narrow ? " \u00B7 need both" : " \u00B7 bring both hands in for the effect"));

  updateDataPanel(hands, handedness, poly, tilt);
}

function bindControls() {
  const $ = id => document.getElementById(id);
  const stylePanel = $('stylePanel');
  const dataPanel  = $('dataPanel');

  renderErrorCodesList();
  renderErrorLog(); // in case E01-E04 already fired before this ran (camera/model failures happen pre-bindControls)
  $('errorCodesToggle').addEventListener('click', () => {
    const panel = $('errorCodesPanel');
    const open = panel.classList.toggle('open');
    $('errorCodesToggle').textContent = open ? 'Error codes ▴' : 'Error codes ▾';
  });

  const PIXELATED_STYLES = ['invert', 'solid', 'cycle', 'glow', 'scan'];
  const BLEND_STYLES = ['invert', 'cycle'];

  const syncControlAvailability = () => {
    const is3d = settings.viewMode === '3d';
    $('depthModeRow').classList.toggle('disabled', is3d);
    $('depthAmountRow').classList.toggle('disabled', is3d || settings.depthMode !== 'warp');
    $('effectRow').classList.toggle('disabled', is3d);
    $('blendRow').classList.toggle('disabled', is3d || !BLEND_STYLES.includes(settings.effectStyle));
    $('pixelRow').classList.toggle('disabled', is3d || !PIXELATED_STYLES.includes(settings.effectStyle));
    $('twistRow').classList.toggle('disabled', !is3d);
  };

  const syncSheetState = () => {
    const anyOpen = stylePanel.classList.contains('open') || dataPanel.classList.contains('open');
    document.body.classList.toggle('sheet-open', anyOpen);
  };

  $('styleToggle').onclick = () => {
    dataPanel.classList.remove('open');
    stylePanel.classList.toggle('open');
    syncSheetState();
  };
  $('dataToggle').onclick  = () => {
    stylePanel.classList.remove('open');
    dataPanel.classList.toggle('open');
    syncSheetState();
  };

  viewModeBtn.addEventListener('click', async () => {
    if (settings.viewMode === 'camera') {
      if (!threeReady) {
        viewModeBtn.disabled = true;
        hud.textContent = 'loading 3D viewport…';
        try {
          await ensureThree();
          threeReady = true;
        } catch (err) {
          const code = logError('E10', err);
          hud.textContent = `${code} \u00B7 3D viewport failed to load`;
          viewModeBtn.disabled = false;
          return;
        }
        viewModeBtn.disabled = false;
      }
      settings.viewMode = '3d';
      viewModeBtn.classList.add('active');
    } else {
      settings.viewMode = 'camera';
      viewModeBtn.classList.remove('active');
    }
    syncControlAvailability();
  });

  $('depthMode').addEventListener('change', e => {
    settings.depthMode = e.target.value;
    smoothedCorners = null;
    syncControlAvailability();
  });
  $('depthAmount').addEventListener('input', e => {
    settings.depthAmount = parseInt(e.target.value, 10) / 100;
    $('depthVal').textContent = settings.depthAmount.toFixed(2);
  });
  $('frameColor').addEventListener('input', e => settings.frameColor = e.target.value);
  $('effectStyle').addEventListener('change', e => {
    settings.effectStyle = e.target.value;
    if (settings.effectStyle !== 'particles') particles = [];
    syncControlAvailability();
  });
  $('blendMode').addEventListener('change', e => settings.blendMode = e.target.value);
  $('blockRes').addEventListener('input', e => {
    settings.blockRes = parseInt(e.target.value, 10);
    $('blockResVal').textContent = settings.blockRes;
    resizeMask();
  });
  $('opacity').addEventListener('input', e => {
    settings.opacity = parseInt(e.target.value, 10) / 100;
    $('opacityVal').textContent = settings.opacity.toFixed(2);
  });
  $('smoothing').addEventListener('input', e => {
    settings.smoothing = parseInt(e.target.value, 10) / 100;
    $('smoothVal').textContent = settings.smoothing.toFixed(2);
  });
  $('frameScale').addEventListener('input', e => {
    settings.frameScale = parseInt(e.target.value, 10) / 100;
    $('scaleVal').textContent = settings.frameScale.toFixed(2);
  });
  $('twistAmount').addEventListener('input', e => {
    settings.twistAmount = parseInt(e.target.value, 10) / 100;
    $('twistVal').textContent = settings.twistAmount.toFixed(2);
  });
  $('skeletonMode').addEventListener('change', e => settings.skeletonMode = e.target.value);
  $('showSkeleton').addEventListener('change', e => settings.showSkeleton = e.target.checked);
  $('showOutline').addEventListener('change', e => settings.showOutline = e.target.checked);
  $('mirrorToggle').addEventListener('change', e => { settings.mirror = e.target.checked; });

  $('resetBtn').addEventListener('click', () => {
    const keepViewMode = settings.viewMode; // don't force user back to camera mode on reset
    Object.assign(settings, DEFAULTS, { viewMode: keepViewMode });
    smoothedCorners = null;
    particles = [];
    $('depthMode').value = settings.depthMode;
    $('depthAmount').value = settings.depthAmount * 100;
    $('depthVal').textContent = settings.depthAmount.toFixed(2);
    $('frameColor').value = settings.frameColor;
    $('effectStyle').value = settings.effectStyle;
    $('blendMode').value = settings.blendMode;
    $('blockRes').value = settings.blockRes;
    $('blockResVal').textContent = settings.blockRes;
    $('opacity').value = settings.opacity * 100;
    $('opacityVal').textContent = settings.opacity.toFixed(2);
    $('smoothing').value = settings.smoothing * 100;
    $('smoothVal').textContent = settings.smoothing.toFixed(2);
    $('frameScale').value = settings.frameScale * 100;
    $('scaleVal').textContent = settings.frameScale.toFixed(2);
    $('twistAmount').value = settings.twistAmount * 100;
    $('twistVal').textContent = settings.twistAmount.toFixed(2);
    twistTurns = 0; lastRollAngle = null; lastHandKey = null; smoothedTwist = null;
    $('skeletonMode').value = settings.skeletonMode;
    $('showSkeleton').checked = true;
    $('showOutline').checked = true;
    $('mirrorToggle').checked = true;
    $('includeAudio').checked = true;
    if (cameraStream) cameraStream.getAudioTracks().forEach(t => { t.enabled = true; });
    micStatus.textContent = hasAudio ? '🎤' : '🔇';
    syncControlAvailability();
    resizeMask();
  });

  syncControlAvailability();
}

/* ---------------- onboarding walkthrough ---------------- */

const ONBOARD_STEPS = [
  { title: 'Frame it with your hands', desc: 'Bring your thumb and index finger together on each hand to draw a box.', visual: 1 },
  { title: 'Live hand tracking', desc: 'Every joint on both hands is tracked in real time, right over the camera.', visual: 2 },
  { title: 'Style & raw data', desc: 'Style changes the colors and effects. Data shows the raw tracking numbers.', visual: 5 },
  { title: 'Hit record', desc: 'Tap the shutter to capture your moves, with a live timer.', visual: 3 },
  { title: '3D data view', desc: 'Tap the cube to see the raw hands and box floating in real 3D space.', visual: 4 }
];

let obIndex = 0;
const onboardEl = document.getElementById('onboarding');
const onboardTitle = document.getElementById('onboardTitle');
const onboardDesc = document.getElementById('onboardDesc');
const onboardDots = document.getElementById('onboardDots').querySelectorAll('span');
const onboardBack = document.getElementById('onboardBack');
const onboardNext = document.getElementById('onboardNext');

function renderOnboardStep() {
  const s = ONBOARD_STEPS[obIndex];
  onboardTitle.textContent = s.title;
  onboardDesc.textContent = s.desc;
  document.querySelectorAll('.ob-visual').forEach(el => el.classList.remove('active'));
  document.getElementById('obVisual' + s.visual).classList.add('active');
  onboardDots.forEach((d, i) => d.classList.toggle('active', i === obIndex));
  onboardBack.disabled = obIndex === 0;
  onboardNext.textContent = obIndex === ONBOARD_STEPS.length - 1 ? "Let's go" : 'Next';
}

function showOnboarding() {
  obIndex = 0;
  renderOnboardStep();
  onboardEl.classList.add('show');
}

function hideOnboarding() {
  onboardEl.classList.remove('show');
  try {
    localStorage.setItem('handmesh_onboarded', '1');
    localStorage.setItem('handmesh_visits', '1');
  } catch (e) { /* private mode — skip persistence */ }
}

onboardNext.addEventListener('click', () => {
  if (obIndex < ONBOARD_STEPS.length - 1) { obIndex++; renderOnboardStep(); }
  else hideOnboarding();
});
onboardBack.addEventListener('click', () => {
  if (obIndex > 0) { obIndex--; renderOnboardStep(); }
});
document.getElementById('onboardSkip').addEventListener('click', hideOnboarding);
document.getElementById('helpBtn').addEventListener('click', showOnboarding);

// Shown once per browser on first visit; runs independently of camera/model
// loading so it's useful reading time rather than a blocking step.
try {
  if (!localStorage.getItem('handmesh_onboarded')) showOnboarding();
  else showWelcomeBack();
} catch (e) { /* localStorage unavailable — just skip both */ }

/* ---------------- welcome back (returning users) ---------------- */
// Distinct from the onboarding modal on purpose: no tutorial, nothing to
// dismiss, nothing blocking — just a quick "good to see you" that fades on its own.

const WELCOME_TIERS = [
  { min: 2,  max: 2,        text: 'Welcome back 👋' },
  { min: 3,  max: 4,        text: 'Good to see you again' },
  { min: 5,  max: 9,        text: "You're getting good at this ✨" },
  { min: 10, max: 19,       text: 'Certified regular 🌀' },
  { min: 20, max: Infinity, text: 'Home again — good to have you 💚' },
];

function showWelcomeBack() {
  let visits = 2;
  try {
    visits = parseInt(localStorage.getItem('handmesh_visits') || '1', 10) + 1;
    localStorage.setItem('handmesh_visits', String(visits));
  } catch (e) { /* private mode — just show the base greeting */ }

  const tier = WELCOME_TIERS.find(t => visits >= t.min && visits <= t.max) || WELCOME_TIERS[0];
  const el = document.getElementById('welcomeBack');
  document.getElementById('welcomeText').textContent = tier.text;
  document.getElementById('welcomeSub').textContent = `\u00B7 session #${visits}`;

  requestAnimationFrame(() => el.classList.add('show'));
  const dismiss = () => el.classList.remove('show');
  el.addEventListener('click', dismiss, { once: true });
  setTimeout(dismiss, 3200);
}

init().catch(err => {
  // init() already calls showFatalError with a specific code before rethrowing
  // for every classified failure — this only catches anything unexpected that
  // slipped through unclassified.
  if (!errorLog.length) {
    hud.textContent = "E99 \u00B7 Unexpected error";
    logError('E99', err);
  }
  console.error(err);
});
</script>
