<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hand Frame Effect</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; font-family: -apple-system, system-ui, sans-serif; }
  #stage { position:relative; width:100vw; height:100vh; }
  video { display:none; } /* pixels only, never shown directly — canvas is what's drawn to screen */
  canvas {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover; transform: scaleX(-1); /* mirror selfie view */
  }
  #hud {
    position:absolute; top:14px; left:14px; z-index:5;
    color:#7CFF9E; background:rgba(0,0,0,0.55); border:1px solid rgba(124,255,158,0.4);
    padding:6px 12px; border-radius:8px; font-size:13px; letter-spacing:0.02em;
    pointer-events:none; white-space:nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">loading hand tracking…</div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const hud    = document.getElementById('hud');

// --- tweakable knobs ---
const PIXEL_BLOCKS = 64;      // lower = chunkier/blockier mask edges
const INVERT_STRENGTH = 1;    // 0-1, css invert() amount
const TINT = 'rgba(70,255,130,0.85)'; // green tint multiplied over the inverted region

// Standard 21-point MediaPipe hand connections
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];
const TIP_IDX = [4, 8, 12, 16, 20];
const HAND_COLORS = ['#4AFFA0', '#FFD24A']; // hand 0, hand 1

let handLandmarker;
let fxCanvas, fxCtx, maskLow, maskCtx;

async function init() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
    },
    numHands: 2,
    runningMode: "VIDEO"
  });

  hud.textContent = "requesting camera…";
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }
  });
  video.srcObject = stream;

  await new Promise(res => { video.onloadedmetadata = res; });
  video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // reusable offscreen buffers, sized once
  fxCanvas = document.createElement('canvas');
  fxCanvas.width = canvas.width;
  fxCanvas.height = canvas.height;
  fxCtx = fxCanvas.getContext('2d');

  const lowW = PIXEL_BLOCKS;
  const lowH = Math.max(1, Math.round(lowW * canvas.height / canvas.width));
  maskLow = document.createElement('canvas');
  maskLow.width = lowW;
  maskLow.height = lowH;
  maskCtx = maskLow.getContext('2d');

  requestAnimationFrame(loop);
}

let lastTime = -1;
function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    const now = performance.now();
    const handRes = handLandmarker.detectForVideo(video, now);
    render(handRes);
  }
  requestAnimationFrame(loop);
}

function toPx(lm) {
  return { x: lm.x * canvas.width, y: lm.y * canvas.height };
}

// Monotone chain convex hull
function convexHull(points) {
  const pts = points.slice().sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function drawHand(pts, color, highlightFrame) {
  ctx.lineWidth = 3;
  ctx.strokeStyle = color;
  ctx.beginPath();
  for (const [a, b] of HAND_CONNECTIONS) {
    ctx.moveTo(pts[a].x, pts[a].y);
    ctx.lineTo(pts[b].x, pts[b].y);
  }
  ctx.stroke();

  for (let i = 0; i < pts.length; i++) {
    const isTip = TIP_IDX.includes(i);
    const r = isTip ? 6 : 3.5;
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
    ctx.fillStyle = isTip ? '#ffffff' : color;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  // ring the thumb tip (4) + index tip (8) — these define the frame shape
  if (highlightFrame) {
    for (const i of [4, 8]) {
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, 10, 0, Math.PI * 2);
      ctx.strokeStyle = '#FFEE55';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function buildLowResMask(hull) {
  const { width: lw, height: lh } = maskLow;
  maskCtx.clearRect(0, 0, lw, lh);
  maskCtx.fillStyle = '#fff';
  maskCtx.beginPath();
  maskCtx.moveTo(hull[0].x / canvas.width * lw, hull[0].y / canvas.height * lh);
  for (let i = 1; i < hull.length; i++) {
    maskCtx.lineTo(hull[i].x / canvas.width * lw, hull[i].y / canvas.height * lh);
  }
  maskCtx.closePath();
  maskCtx.fill();
}

function drawInvertedGreenMask(hull) {
  buildLowResMask(hull);

  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  fxCtx.filter = `invert(${INVERT_STRENGTH}) saturate(1.4)`;
  fxCtx.drawImage(video, 0, 0, fxCanvas.width, fxCanvas.height);
  fxCtx.filter = 'none';

  fxCtx.globalCompositeOperation = 'multiply';
  fxCtx.fillStyle = TINT;
  fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);

  fxCtx.globalCompositeOperation = 'destination-in';
  fxCtx.imageSmoothingEnabled = false; // nearest-neighbor upscale = blocky pixelated edge
  fxCtx.drawImage(maskLow, 0, 0, fxCanvas.width, fxCanvas.height);
  fxCtx.globalCompositeOperation = 'source-over';

  ctx.drawImage(fxCanvas, 0, 0);

  // subtle outline of the frame shape
  ctx.beginPath();
  ctx.moveTo(hull[0].x, hull[0].y);
  for (let i = 1; i < hull.length; i++) ctx.lineTo(hull[i].x, hull[i].y);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(124,255,158,0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function render(handRes) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height); // real camera, unaltered base

  const hands = handRes.landmarks || [];
  const twoHands = hands.length >= 2;

  if (twoHands) {
    const pts = [];
    for (const h of hands.slice(0, 2)) {
      pts.push(toPx(h[4]), toPx(h[8]));
    }
    const hull = convexHull(pts);
    if (hull.length >= 3) drawInvertedGreenMask(hull);
  }

  // hand skeletons drawn on top so they're always visible, even over the effect
  hands.forEach((h, i) => {
    const pts = h.map(toPx);
    drawHand(pts, HAND_COLORS[i % HAND_COLORS.length], twoHands);
  });

  hud.textContent = hands.length === 0
    ? "show your hands to the camera"
    : `${hands.length} hand${hands.length > 1 ? 's' : ''} tracked` + (twoHands ? " · frame effect active" : " · bring both hands in for the effect");
}

init().catch(err => {
  hud.textContent = "error: " + err.message;
  console.error(err);
});
</script>
</body>
</html>
