<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hand Frame Effect</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%;
    font-family: -apple-system, system-ui, sans-serif; }
  #stage { position:relative; width:100vw; height:100vh; }
  video { display:none; }
  canvas {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover; transform: scaleX(-1);
  }
  #hud {
    position:absolute; top:14px; left:14px; z-index:5;
    color:#7CFF9E; background:rgba(0,0,0,0.55); border:1px solid rgba(124,255,158,0.4);
    padding:6px 12px; border-radius:8px; font-size:13px; letter-spacing:0.02em;
    pointer-events:none; white-space:nowrap;
  }
  #toolbar { position:absolute; top:14px; right:14px; z-index:6; display:flex; gap:8px; }
  #toolbar button {
    background:rgba(0,0,0,0.55); color:#7CFF9E; border:1px solid rgba(124,255,158,0.4);
    border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600;
  }
  .sheet {
    position:fixed; left:0; right:0; bottom:0; max-height:50vh; overflow-y:auto;
    background:rgba(9,13,11,0.92); backdrop-filter: blur(12px);
    border-top:1px solid rgba(124,255,158,0.35); border-radius:18px 18px 0 0;
    padding:10px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition: transform .25s ease; z-index:10;
    box-sizing:border-box;
  }
  .sheet.open { transform:translateY(0); }
  .sheet-handle { width:36px; height:4px; border-radius:2px; background:rgba(124,255,158,0.4); margin:8px auto 14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px; color:#CDEFD9; font-size:14px; }
  .row > label:first-child { flex-shrink:0; opacity:0.85; }
  .row select { flex:1; max-width:170px; }
  .row input[type=range] { flex:1; accent-color:#46FF82; }
  select {
    background:rgba(255,255,255,0.08); color:#EAFFF1; border:1px solid rgba(124,255,158,0.3);
    border-radius:6px; padding:5px 8px; font-size:13px;
  }
  input[type=color] { width:44px; height:28px; border:none; background:none; padding:0; border-radius:6px; }
  input[type=checkbox] { accent-color:#46FF82; width:16px; height:16px; }
  .toggles { flex-direction:column; align-items:flex-start; gap:10px; }
  .toggles label { display:flex; align-items:center; gap:8px; }
  #resetBtn {
    width:100%; background:rgba(255,255,255,0.06); color:#7CFF9E;
    border:1px solid rgba(124,255,158,0.35); border-radius:8px; padding:9px; font-size:13px; margin-top:2px;
  }
  #dataOut {
    color:#7CFF9E; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:11px; line-height:1.55; white-space:pre; margin:0;
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">loading hand tracking…</div>

  <div id="toolbar">
    <button id="styleToggle">⚙ Style</button>
    <button id="dataToggle">{ } Data</button>
  </div>

  <div id="stylePanel" class="sheet">
    <div class="sheet-handle"></div>
    <div class="row">
      <label>Frame color</label>
      <input type="color" id="frameColor" value="#46ff82">
    </div>
    <div class="row">
      <label>Effect</label>
      <select id="effectStyle">
        <option value="invert">Invert + tint</option>
        <option value="solid">Solid fill</option>
        <option value="cycle">Color cycle</option>
        <option value="outline">Outline only</option>
      </select>
    </div>
    <div class="row">
      <label>Blend mode</label>
      <select id="blendMode">
        <option value="multiply">Multiply</option>
        <option value="screen">Screen</option>
        <option value="overlay">Overlay</option>
        <option value="difference">Difference</option>
      </select>
    </div>
    <div class="row">
      <label>Depth / twist <span id="depthVal">1.00</span></label>
      <input type="range" id="depthAmount" min="0" max="250" value="100">
    </div>
    <div class="row">
      <label>Pixelation <span id="blockResVal">64</span></label>
      <input type="range" id="blockRes" min="8" max="160" value="64">
    </div>
    <div class="row">
      <label>Opacity <span id="opacityVal">0.85</span></label>
      <input type="range" id="opacity" min="10" max="100" value="85">
    </div>
    <div class="row">
      <label>Smoothing <span id="smoothVal">0.35</span></label>
      <input type="range" id="smoothing" min="0" max="90" value="35">
    </div>
    <div class="row">
      <label>Scale <span id="scaleVal">1.00</span></label>
      <input type="range" id="frameScale" min="50" max="200" value="100">
    </div>
    <div class="row">
      <label>Skeleton color</label>
      <select id="skeletonMode">
        <option value="two-tone">Two-tone</option>
        <option value="match">Match frame</option>
        <option value="rainbow">Rainbow</option>
      </select>
    </div>
    <div class="row toggles">
      <label><input type="checkbox" id="depthShade" checked> Depth shading on edges</label>
      <label><input type="checkbox" id="showSkeleton" checked> Show hand skeleton</label>
      <label><input type="checkbox" id="showOutline" checked> Show frame outline</label>
      <label><input type="checkbox" id="mirrorToggle" checked> Mirror view</label>
    </div>
    <button id="resetBtn">Reset to defaults</button>
  </div>

  <div id="dataPanel" class="sheet">
    <div class="sheet-handle"></div>
    <pre id="dataOut">waiting for hands…</pre>
  </div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const video   = document.getElementById('video');
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const hud     = document.getElementById('hud');
const dataOut = document.getElementById('dataOut');

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];
const TIP_IDX = [4, 8, 12, 16, 20];
const HAND_COLORS = ['#46FF82', '#FFD24A'];
const LANDMARK_NAMES = [
  'wrist','thumb_cmc','thumb_mcp','thumb_ip','thumb_tip',
  'index_mcp','index_pip','index_dip','index_tip',
  'middle_mcp','middle_pip','middle_dip','middle_tip',
  'ring_mcp','ring_pip','ring_dip','ring_tip',
  'pinky_mcp','pinky_pip','pinky_dip','pinky_tip'
];

const DEFAULTS = {
  frameColor: '#46ff82',
  effectStyle: 'invert',
  blendMode: 'multiply',
  depthAmount: 1.0,
  blockRes: 64,
  opacity: 0.85,
  smoothing: 0.35,
  frameScale: 1.0,
  skeletonMode: 'two-tone',
  depthShade: true,
  showSkeleton: true,
  showOutline: true,
  mirror: true
};
const settings = { ...DEFAULTS };

let handLandmarker;
let fxCanvas, fxCtx, maskLow, maskCtx;
let smoothedCorners = null;

function hexToRgba(hex, a) {
  const v = hex.replace('#', '');
  return `rgba(${parseInt(v.substring(0,2),16)},${parseInt(v.substring(2,4),16)},${parseInt(v.substring(4,6),16)},${a})`;
}

async function init() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
    },
    numHands: 2,
    runningMode: "VIDEO"
  });

  hud.textContent = "requesting camera…";
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }
  });
  video.srcObject = stream;

  await new Promise(res => { video.onloadedmetadata = res; });
  await video.play();
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;

  fxCanvas = document.createElement('canvas');
  fxCanvas.width  = canvas.width;
  fxCanvas.height = canvas.height;
  fxCtx = fxCanvas.getContext('2d');

  maskLow = document.createElement('canvas');
  maskCtx = maskLow.getContext('2d');
  resizeMask();

  bindControls();
  requestAnimationFrame(loop);
}

function resizeMask() {
  if (!maskLow) return;
  const lowW = settings.blockRes;
  maskLow.width  = lowW;
  maskLow.height = Math.max(1, Math.round(lowW * canvas.height / canvas.width));
}

let lastVideoTime = -1;
let lastRafTs = performance.now();
let fps = 0, detectMs = 0;

function loop(ts) {
  const dt = ts - lastRafTs;
  lastRafTs = ts;
  if (dt > 0) fps = fps ? fps * 0.9 + (1000 / dt) * 0.1 : 1000 / dt;

  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const t0 = performance.now();
    const handRes = handLandmarker.detectForVideo(video, ts);
    detectMs = detectMs * 0.9 + (performance.now() - t0) * 0.1;
    render(handRes);
  }
  requestAnimationFrame(loop);
}

const toPx = lm => ({ x: lm.x * canvas.width, y: lm.y * canvas.height, z: lm.z });

/* Build the quad straight from the four fingertips — this is what made the
   earlier version feel alive. Order them around the centroid so the polygon
   never self-intersects, then push each corner along the centroid ray by its
   relative depth: near corners bulge out, far corners pull in. That's what
   sells the twist as perspective instead of a flat spinning rect. */
function buildQuad(tipPoints) {
  const cx = tipPoints.reduce((s, p) => s + p.x, 0) / tipPoints.length;
  const cy = tipPoints.reduce((s, p) => s + p.y, 0) / tipPoints.length;

  const ordered = tipPoints
    .map(p => ({ ...p, ang: Math.atan2(p.y - cy, p.x - cx) }))
    .sort((a, b) => a.ang - b.ang);

  const zs = ordered.map(p => p.z);
  const zMin = Math.min(...zs), zMax = Math.max(...zs);
  const zRange = Math.max(1e-4, zMax - zMin);
  const k = settings.depthAmount;

  return ordered.map(p => {
    // 0 = nearest corner, 1 = farthest (MediaPipe z is negative toward camera)
    const t = (p.z - zMin) / zRange;
    const push = 1 + (0.5 - t) * 0.45 * k;
    return {
      x: cx + (p.x - cx) * push,
      y: cy + (p.y - cy) * push,
      z: p.z,
      depth: t
    };
  });
}

function centroid(pts) {
  let cx = 0, cy = 0;
  for (const p of pts) { cx += p.x; cy += p.y; }
  return { x: cx / pts.length, y: cy / pts.length };
}

function scalePolygon(pts, f) {
  if (f === 1) return pts;
  const c = centroid(pts);
  return pts.map(p => ({ ...p, x: c.x + (p.x - c.x) * f, y: c.y + (p.y - c.y) * f }));
}

function smoothCorners(corners) {
  const a = settings.smoothing;
  if (a <= 0 || !smoothedCorners || smoothedCorners.length !== corners.length) {
    smoothedCorners = corners.map(p => ({ ...p }));
    return smoothedCorners;
  }
  smoothedCorners = smoothedCorners.map((prev, i) => ({
    x: prev.x * a + corners[i].x * (1 - a),
    y: prev.y * a + corners[i].y * (1 - a),
    z: corners[i].z,
    depth: prev.depth * a + corners[i].depth * (1 - a)
  }));
  return smoothedCorners;
}

function polygonArea(pts) {
  let area = 0;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    area += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
  }
  return Math.abs(area / 2);
}

function skeletonColorFor(i) {
  if (settings.skeletonMode === 'match') return settings.frameColor;
  if (settings.skeletonMode === 'rainbow') return `hsl(${(i * 137 + performance.now() / 20) % 360}, 90%, 60%)`;
  return HAND_COLORS[i % HAND_COLORS.length];
}

function drawHand(pts, color, highlightFrame) {
  ctx.lineWidth = 3;
  ctx.strokeStyle = color;
  ctx.beginPath();
  for (const [a, b] of HAND_CONNECTIONS) {
    ctx.moveTo(pts[a].x, pts[a].y);
    ctx.lineTo(pts[b].x, pts[b].y);
  }
  ctx.stroke();

  for (let i = 0; i < pts.length; i++) {
    const isTip = TIP_IDX.includes(i);
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, isTip ? 6 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = isTip ? '#ffffff' : color;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  if (highlightFrame) {
    for (const i of [4, 8]) {
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, 10, 0, Math.PI * 2);
      ctx.strokeStyle = '#FFEE55';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function tracePath(c, poly, sx = 1, sy = 1) {
  c.beginPath();
  c.moveTo(poly[0].x * sx, poly[0].y * sy);
  for (let i = 1; i < poly.length; i++) c.lineTo(poly[i].x * sx, poly[i].y * sy);
  c.closePath();
}

function buildLowResMask(poly) {
  const { width: lw, height: lh } = maskLow;
  maskCtx.clearRect(0, 0, lw, lh);
  maskCtx.fillStyle = '#fff';
  tracePath(maskCtx, poly, lw / canvas.width, lh / canvas.height);
  maskCtx.fill();
}

/* Edges shaded by the depth of their endpoints — near edges bright and thick,
   far edges dim and thin. Cheap, but it's the cue that reads as 3D. */
function drawDepthEdges(poly) {
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const d = (a.depth + b.depth) / 2;
    const near = 1 - d;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = hexToRgba(settings.frameColor, 0.25 + near * 0.75);
    ctx.lineWidth = 1.5 + near * 4;
    ctx.stroke();
  }
  for (const p of poly) {
    const near = 1 - p.depth;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 + near * 5, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(settings.frameColor, 0.4 + near * 0.6);
    ctx.fill();
  }
}

function drawFrameEffect(poly) {
  const tint = hexToRgba(settings.frameColor, settings.opacity);

  if (settings.effectStyle !== 'outline') {
    buildLowResMask(poly);
    fxCtx.save();
    fxCtx.setTransform(1, 0, 0, 1, 0, 0);
    fxCtx.globalCompositeOperation = 'source-over';
    fxCtx.filter = 'none';
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

    if (settings.effectStyle === 'invert') {
      fxCtx.filter = 'invert(1) saturate(1.4)';
      fxCtx.drawImage(video, 0, 0, fxCanvas.width, fxCanvas.height);
      fxCtx.filter = 'none';
      fxCtx.globalCompositeOperation = settings.blendMode;
      fxCtx.fillStyle = tint;
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
    } else if (settings.effectStyle === 'solid') {
      fxCtx.fillStyle = tint;
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
    } else if (settings.effectStyle === 'cycle') {
      fxCtx.filter = `invert(1) hue-rotate(${(performance.now() / 15) % 360}deg) saturate(2)`;
      fxCtx.drawImage(video, 0, 0, fxCanvas.width, fxCanvas.height);
      fxCtx.filter = 'none';
      fxCtx.globalCompositeOperation = settings.blendMode;
      fxCtx.fillStyle = hexToRgba(settings.frameColor, settings.opacity * 0.6);
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
    }

    fxCtx.globalCompositeOperation = 'destination-in';
    fxCtx.imageSmoothingEnabled = false;
    fxCtx.drawImage(maskLow, 0, 0, fxCanvas.width, fxCanvas.height);
    fxCtx.restore();

    ctx.drawImage(fxCanvas, 0, 0);
  }

  if (settings.depthShade) {
    drawDepthEdges(poly);
  } else if (settings.showOutline || settings.effectStyle === 'outline') {
    const isOutlineMode = settings.effectStyle === 'outline';
    tracePath(ctx, poly);
    ctx.strokeStyle = hexToRgba(settings.frameColor, isOutlineMode ? Math.max(settings.opacity, 0.6) : 0.4);
    ctx.lineWidth = isOutlineMode ? 4 : 2;
    ctx.stroke();
  }
}

let dataFrameCounter = 0;
function updateDataPanel(hands, handedness, poly, tilt) {
  if (!document.getElementById('dataPanel').classList.contains('open')) return;
  if (++dataFrameCounter % 5 !== 0) return;

  let out = `render fps  ${fps.toFixed(1)}\ndetect ms   ${detectMs.toFixed(1)}\nhands       ${hands.length}\n`;
  if (poly) {
    out += `frame area  ${polygonArea(poly).toFixed(0)} px\u00B2\n`;
    out += `depth tilt  ${tilt.toFixed(3)}\n`;
    out += `corner z    ${poly.map(p => p.z.toFixed(3)).join('  ')}\n`;
  }
  out += `\n`;

  hands.forEach((h, i) => {
    const hd = handedness?.[i]?.[0];
    const shown = hd ? (settings.mirror
      ? (hd.categoryName === 'Left' ? 'Right' : 'Left')
      : hd.categoryName) : null;
    out += `-- hand ${i}${shown ? `  ${shown} ${(hd.score * 100).toFixed(0)}%` : ''} --\n`;
    h.forEach((lm, j) => {
      out += `${LANDMARK_NAMES[j].padEnd(11)} x:${lm.x.toFixed(3)} y:${lm.y.toFixed(3)} z:${lm.z.toFixed(3)}\n`;
    });
    out += `\n`;
  });

  dataOut.textContent = out.trimEnd();
}

function render(handRes) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const raw = handRes.landmarks || [];
  const handedRaw = handRes.handednesses || handRes.handedness || [];
  const order = raw.map((h, i) => i).sort((a, b) => raw[a][0].x - raw[b][0].x);
  const hands = order.map(i => raw[i]);
  const handedness = order.map(i => handedRaw[i]);

  const twoHands = hands.length >= 2;
  let poly = null, tilt = 0;

  if (twoHands) {
    const tips = [];
    for (const h of hands.slice(0, 2)) tips.push(toPx(h[4]), toPx(h[8]));
    const quad = buildQuad(tips);
    poly = smoothCorners(scalePolygon(quad, settings.frameScale));
    const zs = poly.map(p => p.z);
    tilt = Math.max(...zs) - Math.min(...zs);
    drawFrameEffect(poly);
  } else {
    smoothedCorners = null;
  }

  if (settings.showSkeleton) {
    hands.forEach((h, i) => drawHand(h.map(toPx), skeletonColorFor(i), twoHands));
  }

  hud.textContent = hands.length === 0
    ? "show your hands to the camera"
    : `${hands.length} hand${hands.length > 1 ? 's' : ''} tracked`
      + (twoHands ? ` \u00B7 tilt ${tilt.toFixed(2)}` : " \u00B7 bring both hands in for the effect");

  updateDataPanel(hands, handedness, poly, tilt);
}

function bindControls() {
  const $ = id => document.getElementById(id);
  const stylePanel = $('stylePanel');
  const dataPanel  = $('dataPanel');

  $('styleToggle').onclick = () => { dataPanel.classList.remove('open'); stylePanel.classList.toggle('open'); };
  $('dataToggle').onclick  = () => { stylePanel.classList.remove('open'); dataPanel.classList.toggle('open'); };

  $('frameColor').addEventListener('input', e => settings.frameColor = e.target.value);
  $('effectStyle').addEventListener('change', e => settings.effectStyle = e.target.value);
  $('blendMode').addEventListener('change', e => settings.blendMode = e.target.value);
  $('depthAmount').addEventListener('input', e => {
    settings.depthAmount = parseInt(e.target.value, 10) / 100;
    $('depthVal').textContent = settings.depthAmount.toFixed(2);
  });
  $('blockRes').addEventListener('input', e => {
    settings.blockRes = parseInt(e.target.value, 10);
    $('blockResVal').textContent = settings.blockRes;
    resizeMask();
  });
  $('opacity').addEventListener('input', e => {
    settings.opacity = parseInt(e.target.value, 10) / 100;
    $('opacityVal').textContent = settings.opacity.toFixed(2);
  });
  $('smoothing').addEventListener('input', e => {
    settings.smoothing = parseInt(e.target.value, 10) / 100;
    $('smoothVal').textContent = settings.smoothing.toFixed(2);
  });
  $('frameScale').addEventListener('input', e => {
    settings.frameScale = parseInt(e.target.value, 10) / 100;
    $('scaleVal').textContent = settings.frameScale.toFixed(2);
  });
  $('skeletonMode').addEventListener('change', e => settings.skeletonMode = e.target.value);
  $('depthShade').addEventListener('change', e => settings.depthShade = e.target.checked);
  $('showSkeleton').addEventListener('change', e => settings.showSkeleton = e.target.checked);
  $('showOutline').addEventListener('change', e => settings.showOutline = e.target.checked);
  $('mirrorToggle').addEventListener('change', e => {
    settings.mirror = e.target.checked;
    canvas.style.transform = settings.mirror ? 'scaleX(-1)' : 'none';
  });

  $('resetBtn').addEventListener('click', () => {
    Object.assign(settings, DEFAULTS);
    smoothedCorners = null;
    $('frameColor').value = settings.frameColor;
    $('effectStyle').value = settings.effectStyle;
    $('blendMode').value = settings.blendMode;
    $('depthAmount').value = settings.depthAmount * 100;
    $('depthVal').textContent = settings.depthAmount.toFixed(2);
    $('blockRes').value = settings.blockRes;
    $('blockResVal').textContent = settings.blockRes;
    $('opacity').value = settings.opacity * 100;
    $('opacityVal').textContent = settings.opacity.toFixed(2);
    $('smoothing').value = settings.smoothing * 100;
    $('smoothVal').textContent = settings.smoothing.toFixed(2);
    $('frameScale').value = settings.frameScale * 100;
    $('scaleVal').textContent = settings.frameScale.toFixed(2);
    $('skeletonMode').value = settings.skeletonMode;
    $('depthShade').checked = true;
    $('showSkeleton').checked = true;
    $('showOutline').checked = true;
    $('mirrorToggle').checked = true;
    canvas.style.transform = 'scaleX(-1)';
    resizeMask();
  });
}

init().catch(err => {
  hud.textContent = "error: " + err.message;
  console.error(err);
});
</script>
</body>
