<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hand Frame Mesh</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; font-family: -apple-system, system-ui, sans-serif; }
  #stage { position:relative; width:100vw; height:100vh; }
  video, canvas {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover; transform: scaleX(-1);
  }
  video { visibility:hidden; } /* we only need its pixels, not to see it doubled under canvas */
  #hud {
    position:absolute; top:14px; left:14px; z-index:5;
    color:#7CFF9E; background:rgba(0,0,0,0.55); border:1px solid rgba(124,255,158,0.4);
    padding:6px 12px; border-radius:8px; font-size:13px; letter-spacing:0.02em;
    pointer-events:none;
  }
  #hud.hide { display:none; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">loading models…</div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
import { Delaunay } from "https://cdn.jsdelivr.net/npm/d3-delaunay@6/+esm";

const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const hud    = document.getElementById('hud');

let handLandmarker, faceLandmarker;

async function init() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
    },
    numHands: 2,
    runningMode: "VIDEO"
  });

  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
    },
    numFaces: 1,
    runningMode: "VIDEO"
  });

  hud.textContent = "requesting camera…";
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }
  });
  video.srcObject = stream;

  await new Promise(res => { video.onloadedmetadata = res; });
  video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  hud.textContent = "make a frame with both hands \u2192";
  setTimeout(() => hud.classList.add('hide'), 4000);

  requestAnimationFrame(loop);
}

let lastTime = -1;
function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    const now = performance.now();
    const handRes = handLandmarker.detectForVideo(video, now);
    const faceRes = faceLandmarker.detectForVideo(video, now);
    render(handRes, faceRes);
  }
  requestAnimationFrame(loop);
}

function toPx(lm) {
  return { x: lm.x * canvas.width, y: lm.y * canvas.height };
}

// Monotone chain convex hull
function convexHull(points) {
  const pts = points.slice().sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function render(handRes, faceRes) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const hasHands = handRes.landmarks && handRes.landmarks.length >= 2;
  const hasFace  = faceRes.faceLandmarks && faceRes.faceLandmarks.length > 0;
  if (!hasHands || !hasFace) return;

  // Frame corners: thumb tip (4) + index tip (8) from each detected hand
  const pts = [];
  for (const hand of handRes.landmarks.slice(0, 2)) {
    pts.push(toPx(hand[4]));
    pts.push(toPx(hand[8]));
  }
  const hull = convexHull(pts);
  if (hull.length < 3) return;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(hull[0].x, hull[0].y);
  for (let i = 1; i < hull.length; i++) ctx.lineTo(hull[i].x, hull[i].y);
  ctx.closePath();
  ctx.clip();

  // Green triangulated face mesh, clipped to the hand frame
  const face = faceRes.faceLandmarks[0].map(toPx);
  const delaunay = Delaunay.from(face, d => d.x, d => d.y);
  const tris = delaunay.triangles;

  ctx.lineWidth = 1;
  ctx.fillStyle = "rgba(50, 230, 100, 0.55)";
  ctx.strokeStyle = "rgba(10, 70, 25, 0.85)";
  for (let i = 0; i < tris.length; i += 3) {
    const a = face[tris[i]], b = face[tris[i + 1]], c = face[tris[i + 2]];
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();

  // Faint frame outline
  ctx.beginPath();
  ctx.moveTo(hull[0].x, hull[0].y);
  for (let i = 1; i < hull.length; i++) ctx.lineTo(hull[i].x, hull[i].y);
  ctx.closePath();
  ctx.strokeStyle = "rgba(124,255,158,0.35)";
  ctx.lineWidth = 2;
  ctx.stroke();
}

init().catch(err => {
  hud.classList.remove('hide');
  hud.textContent = "error: " + err.message;
  console.error(err);
});
</script>
</body>
</html>
